spring.application.name=learning-service
spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/learning}
spring.datasource.username=${DATABASE_USER:studyforge}
spring.datasource.password=${DATABASE_PASSWORD:studyforge}
spring.datasource.hikari.maximum-pool-size=10

# Kafka (Redpanda in compose). Idempotent producer: retries never duplicate or reorder within a partition.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Transactional outbox: event publications live in Postgres until Kafka acknowledged them.
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.externalization.enabled=true

spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.tracing.sampling.probability=${TRACING_SAMPLING:0.0}
management.otlp.metrics.export.enabled=${OTLP_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
