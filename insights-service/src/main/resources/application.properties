spring.application.name=insights-service
spring.threads.virtual.enabled=true
server.port=${PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/insights}
spring.datasource.username=${DATABASE_USER:studyforge}
spring.datasource.password=${DATABASE_PASSWORD:studyforge}
spring.datasource.hikari.maximum-pool-size=10

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.consumer.group-id=insights
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Retry topics and the DLT are written with a String template too.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

insights.retry.attempts=${INSIGHTS_RETRY_ATTEMPTS:4}
insights.retry.delay-ms=${INSIGHTS_RETRY_DELAY_MS:1000}

spring.mvc.problemdetails.enabled=true
spring.mvc.async.request-timeout=-1

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.tracing.sampling.probability=${TRACING_SAMPLING:0.0}
management.otlp.metrics.export.enabled=${OTLP_ENABLED:false}

# API docs under /api/insights so the web proxy serves them: /api/insights/docs, /api/insights/openapi.
springdoc.swagger-ui.path=/api/insights/docs
springdoc.api-docs.path=/api/insights/openapi
