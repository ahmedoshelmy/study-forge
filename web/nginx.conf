# Serves the SPA; /api/insights (REST + SSE) goes to insights-service, the rest of /api to learning-service.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/insights/ {
        proxy_pass http://insights:8081;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://learning:8080;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
